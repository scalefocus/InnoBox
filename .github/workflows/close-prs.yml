# This repository does not accept external pull requests (INNOBOX_SPEC.md §21.5).
# GitHub cannot disable them, so this closes them politely and points at the issue
# tracker. Pull requests opened from a branch of this repository — the maintainers'
# own — are left alone.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    # Only fork PRs. A maintainer's branch PR in this repo is left open.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Thanks for taking the time to write this — and sorry for the automated reply.",
              "",
              "**This repository does not accept external pull requests**, so this one is being",
              "closed unreviewed. That is not a judgement on your change: InnoBox is developed by",
              "one organization for its own use, and we are not resourced to review, test, and take",
              "responsibility for external code. We would rather say so immediately than leave your",
              "work sitting unreviewed.",
              "",
              "What does help, and is genuinely read:",
              "",
              "- **Open an [issue](../../issues)** describing the bug or the change you wanted. If",
              "  this PR fixes something real, the issue is how it gets fixed.",
              "- **Fork it.** InnoBox is Apache-2.0 and the branding is deliberately arranged to be",
              "  strippable in a handful of edits — see the TRADEMARK section of the README.",
              "",
              "If this is a **security vulnerability**, please do not leave it in a public PR or",
              "issue — use private vulnerability reporting instead (see `SECURITY.md`).",
              "",
              "See `CONTRIBUTING.md` for the full reasoning.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed",
            });
