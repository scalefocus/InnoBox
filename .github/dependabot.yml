# Dependabot: weekly version-update PRs (INNOBOX_SPEC.md §21.6). Security updates are
# governed separately (Settings → Advanced Security → Dependabot security updates).
# Dependabot opens its PRs from branches of this repository, so the close-prs workflow
# (fork PRs only) leaves them open.
version: 2
updates:
  # pnpm workspace (root pnpm-lock.yaml covers all packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One grouped PR for routine bumps instead of a PR per package.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 redesigned its package exports: require("typescript") returns a
      # version-only stub, which breaks Next.js's built-in TS integration during
      # `next build`. Blocked until Next.js supports it; 6.x minors/patches still flow.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed the context.getFilename()/scopeManager APIs that the plugins
      # eslint-config-next bundles (eslint-plugin-react, -jsx-a11y, -import; all peer
      # ESLint <=9) still call, so `pnpm --filter @innobox/web lint` crashes on 10.
      # packages/web stays on ESLint 9 until they support 10 (shared/worker are on 10).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
